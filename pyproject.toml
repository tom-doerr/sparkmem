[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparkmem"
version = "0.1.0"
description = "An SSH memory TUI for NVIDIA Spark UMA systems and Linux servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8.0,<9"]

[project.scripts]
sparkmem = "sparkmem.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
